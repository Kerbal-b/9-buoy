<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buoy mission map</title>
  <link rel="stylesheet" href="map_assets/leaflet.css">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; background: #15222b; }
    .leaflet-container { background: #15222b; font: 12px sans-serif; }
    .leaflet-control-attribution { background: rgba(8, 18, 26, .76) !important; color: #e6ecf2; }
    .leaflet-control-attribution a { color: #9ed7fa; }
    .mission-pin { display: grid; place-items: center; border-radius: 50%; font: bold 11px sans-serif; box-shadow: 0 1px 4px #071019; }
    .mission-pin.home { width: 26px; height: 26px; background: #4dca81; color: #061d10; border: 2px solid #0a3b22; }
    .mission-pin.end { width: 26px; height: 26px; background: #d29aff; color: #24132f; border: 2px solid #593778; }
    .mission-pin.boundary { width: 22px; height: 22px; background: #46a5d3; color: #07151f; border: 2px solid #12384f; }
    .mission-pin.waypoint { width: 24px; height: 24px; background: #ffb454; color: #291704; border: 2px solid #5f360a; }
    .mission-pin.measurement { width: 30px; height: 30px; background: #7ce3ac; color: #092317; border: 2px solid #246341; font-size: 10px; }
    .mission-pin.waypoint.active { background: #ffffff; color: #111820; border: 3px solid #3d83ff; box-shadow: 0 0 0 5px rgba(61,131,255,.3); }
    .mission-pin.buoy { width: 28px; height: 28px; background: #38c5ff; color: #06202c; border: 3px solid #e7f9ff; box-shadow: 0 0 0 5px rgba(56,197,255,.25); }
    #buoy-overlay { position: absolute; z-index: 1000; top: 10px; left: 10px; width: min(340px, calc(100% - 40px)); padding: 9px 11px; border: 1px solid rgba(112, 152, 180, .75); border-radius: 10px; color: #e6ecf2; background: rgba(8, 18, 26, .91); box-shadow: 0 4px 18px rgba(0,0,0,.32); font: 10px/1.35 sans-serif; pointer-events: none; }
    #buoy-overlay .eyebrow { color: #8faabd; font-size: 8px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    #buoy-overlay .position { margin: 2px 0 6px; color: #f1f6fa; font-size: 12px; font-weight: 700; }
    #buoy-overlay .action-row { display: grid; grid-template-columns: 50px 1fr; gap: 3px 7px; }
    #buoy-overlay .label { color: #8faabd; }
    #buoy-overlay .value { color: #e6ecf2; font-weight: 600; }
    #map-status { position: absolute; z-index: 1000; top: 50px; right: 10px; max-width: 300px; padding: 7px 10px; border-radius: 6px; color: #e6ecf2; background: rgba(8, 18, 26, .88); font: 12px sans-serif; display: none; }
    #map-mode-control { position: absolute; z-index: 1001; top: 10px; right: 10px; }
    #map-mode-toggle { border: 1px solid #5b7489; border-radius: 7px; padding: 7px 10px; color: #e6ecf2; background: rgba(8, 18, 26, .94); font: 600 11px sans-serif; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
    #map-mode-toggle:hover:not(:disabled) { border-color: #59b7ff; background: #14283a; }
    #map-mode-toggle:disabled { color: #829aad; cursor: default; opacity: .82; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="buoy-overlay" role="status">
    <div class="eyebrow">Buoy status</div>
    <div class="position" id="buoy-position">Position unavailable</div>
    <div class="action-row">
      <div class="label">Now</div><div class="value" id="buoy-action">Waiting for buoy status</div>
      <div class="label">Next</div><div class="value" id="buoy-next-action">Waiting for mission status</div>
    </div>
  </div>
  <div id="map-status" role="status"></div>
  <div id="map-mode-control"><button id="map-mode-toggle" type="button" aria-label="Change map mode">Map: Auto</button></div>
  <script src="map_assets/leaflet.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
    "use strict";
    const map = L.map("map", {zoomControl: false}).setView([37.53188, -122.24802], 14);
    const terrain = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
      subdomains: "abc", maxNativeZoom: 17, maxZoom: 19,
      updateWhenIdle: true, updateWhenZooming: false, keepBuffer: 1,
      attribution: 'Map data: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>, SRTM | Map: © <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'
    });
    const satellite = L.tileLayer("https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}", {
      maxNativeZoom: 16, maxZoom: 19,
      updateWhenIdle: true, updateWhenZooming: false, keepBuffer: 1,
      attribution: 'Map services and data available from <a href="https://www.usgs.gov/programs/national-geospatial-program/national-map">U.S. Geological Survey, National Geospatial Program</a> (U.S. detail)'
    });
    let base = satellite.addTo(map);
    let bridge = null;
    let missionLayer = L.layerGroup().addTo(map);
    let offlineLayer = null;
    let offlineTemplate = "";
    let remoteTileErrors = 0;
    let offlineActive = false;
    let mapMode = "auto";
    const status = document.getElementById("map-status");
    const modeButton = document.getElementById("map-mode-toggle");

    function updateMapModeButton() {
      const names = {auto: "Auto", online: "Online", offline: "Offline"};
      modeButton.textContent = "Map: " + names[mapMode];
      modeButton.disabled = mapMode === "offline" && !offlineLayer;
      modeButton.setAttribute("aria-label", "Map mode: " + names[mapMode] + ". Click to change mode.");
    }
    function applyMapMode() {
      if (mapMode === "offline") {
        if (!offlineLayer) {
          mapMode = "auto";
          updateMapModeButton();
          report("No offline map package is available for this mission");
          return;
        }
        if (map.hasLayer(base)) map.removeLayer(base);
        offlineActive = true;
        offlineLayer.addTo(map);
        report("Offline USGS map · forced for testing");
      } else {
        if (offlineActive && offlineLayer) map.removeLayer(offlineLayer);
        offlineActive = false;
        if (!map.hasLayer(base)) base.addTo(map);
        report(mapMode === "online" ? "Online map · offline fallback disabled" : "");
      }
      remoteTileErrors = 0;
      updateMapModeButton();
    }
    modeButton.addEventListener("click", () => {
      if (!offlineLayer) mapMode = mapMode === "online" ? "auto" : "online";
      else mapMode = mapMode === "auto" ? "online" : mapMode === "online" ? "offline" : "auto";
      applyMapMode();
    });

    function report(message) {
      status.textContent = message;
      status.style.display = message ? "block" : "none";
    }
    window.setBuoyStatus = function (data) {
      const position = data && data.position;
      document.getElementById("buoy-position").textContent = position
        ? Number(position.lat).toFixed(6) + ", " + Number(position.lon).toFixed(6)
        : "Position unavailable";
      document.getElementById("buoy-action").textContent = String(data && data.action || "Waiting for buoy status");
      document.getElementById("buoy-next-action").textContent = String(data && data.next_action || "Waiting for mission status");
    };
    function latLng(point) { return [Number(point.lat), Number(point.lon)]; }
    function pin(label, kind, size) {
      return L.divIcon({className: "", html: '<span class="mission-pin ' + kind + '">' + label + '</span>', iconSize: [size, size], iconAnchor: [size / 2, size / 2]});
    }
    function marker(point, label, kind, index, active) {
      const size = kind === "home" || kind === "end" ? 30 : kind === "boundary" ? 26 : 28;
      const iconKind = active ? kind + " active" : kind;
      const item = L.marker(latLng(point), {icon: pin(label, iconKind, size), keyboard: false}).addTo(missionLayer);
      item.on("click", event => {
        L.DomEvent.stopPropagation(event);
        if (bridge) bridge.pointSelected(kind === "boundary" ? "boundary" : kind === "home" ? "home" : kind === "end" ? "end" : "waypoints", index);
      });
    }
    window.setMissionData = function (data) {
      missionLayer.clearLayers();
      const boundary = Array.isArray(data.boundary) ? data.boundary : [];
      const waypoints = Array.isArray(data.waypoints) ? data.waypoints : [];
      const plannedRoute = Array.isArray(data.planned_route) && data.planned_route.length
        ? data.planned_route : waypoints;
      const returnRoute = Array.isArray(data.return_route) ? data.return_route : [];
      const outboundRoute = returnRoute.length
        ? plannedRoute.slice(0, Math.max(0, plannedRoute.length - returnRoute.length))
        : plannedRoute;
      const activeIndex = Number.isInteger(Number(data.active_index)) ? Number(data.active_index) : -1;
      const completedCount = Math.max(0, Math.min(waypoints.length, Number(data.completed_count) || 0));
      if (boundary.length >= 3) {
        const waterArea = boundary.map(latLng);
        L.polygon(waterArea, {color: "#ff365b", weight: 10, opacity: .38, fillColor: "#8b5cf6", fillOpacity: .10, interactive: data.show_boundary_points !== false}).addTo(missionLayer);
        L.polygon(waterArea, {color: "#ff4d6d", weight: 3, opacity: 1, fillColor: "#8b5cf6", fillOpacity: .22, interactive: data.show_boundary_points !== false}).addTo(missionLayer);
      }
      const routeLine = (data.home ? [data.home] : []).concat(outboundRoute);
      if (data.edit_mode !== "boundary" && routeLine.length >= 2) L.polyline(routeLine.map(latLng), {color: "#ffb454", weight: 3}).addTo(missionLayer);
      if (data.edit_mode !== "boundary" && completedCount >= 2) L.polyline(waypoints.slice(0, completedCount).map(latLng), {color: "#4dca81", weight: 5, opacity: .9}).addTo(missionLayer);
      if (data.edit_mode !== "boundary" && returnRoute.length && waypoints.length) {
        L.polyline([latLng(waypoints[waypoints.length - 1]), ...returnRoute.map(latLng)],
          {color: "#c28cff", weight: 4, dashArray: "8 6", opacity: .95}).addTo(missionLayer);
        returnRoute.slice(0, -1).forEach(point => {
          L.circleMarker(latLng(point), {radius: 4, color: "#ead5ff", weight: 2, fillColor: "#a665e8", fillOpacity: 1}).addTo(missionLayer);
        });
      } else if (data.edit_mode !== "boundary" && waypoints.length && data.end && !data.planned_route) {
        L.polyline([latLng(waypoints[waypoints.length - 1]), latLng(data.end)],
          {color: "#d29aff", weight: 2, dashArray: "6 6", opacity: .85}).addTo(missionLayer);
      }
      let measurementNumber = 0;
      if (data.edit_mode !== "boundary") waypoints.forEach((point, index) => {
        const collectsData = point.collect_data === true || (point.collect_data === undefined && Number(point.hold_seconds) > 0);
        if (collectsData) {
          measurementNumber += 1;
          L.circle(latLng(point), {radius: 5, color: "#7ce3ac", weight: 1, fillColor: "#7ce3ac", fillOpacity: .30}).addTo(missionLayer);
        }
        if (data.is_buoy_mission && !collectsData) {
          L.circleMarker(latLng(point), {radius: 4, color: "#ead5ff", weight: 1, fillColor: "#a665e8", fillOpacity: 1})
            .bindTooltip("Transit point " + (index + 1), {direction: "top", opacity: .95})
            .addTo(missionLayer);
        } else if (data.is_buoy_mission && collectsData) {
          marker(point, "M" + measurementNumber, "waypoint measurement", index, index === activeIndex);
        } else if (data.movement_mode !== "automatic" || index === 0 || index === waypoints.length - 1 || (index + 1) % 10 === 0) {
          marker(point, String(index + 1), "waypoint", index, index === activeIndex);
        }
      });
      if (data.show_boundary_points !== false && data.edit_mode !== "points") boundary.forEach((point, index) => marker(point, String(index + 1), "boundary", index));
      if (data.edit_mode !== "boundary" && data.home) {
        L.circle(latLng(data.home), {radius: 30, color: "#57c8ff", weight: 2,
          dashArray: "7 5", fillColor: "#57c8ff", fillOpacity: .10, interactive: false}).addTo(missionLayer);
        marker(data.home, data.end_is_home ? "H/E" : "H", "home", -1);
      }
      if (data.edit_mode !== "boundary" && data.end && !data.end_is_home) marker(data.end, "E", "end", -1);
      if (data.current_location && Number.isFinite(Number(data.current_location.lat)) && Number.isFinite(Number(data.current_location.lon))) {
        marker(data.current_location, "B", "buoy", -1);
      }
    };
    window.setMissionStyle = function (style) {
      const next = style === "terrain" ? terrain : satellite;
      if (base !== next) {
        if (offlineActive && offlineLayer) map.removeLayer(offlineLayer);
        offlineActive = false;
        if (map.hasLayer(base)) map.removeLayer(base);
        base = next.addTo(map);
        if (mapMode === "offline") applyMapMode();
      }
      remoteTileErrors = 0;
      if (!offlineActive) report("");
    };
    window.setOfflineTileTemplate = function (template) {
      const nextTemplate = String(template || "");
      if (nextTemplate === offlineTemplate && (offlineLayer || !nextTemplate)) return;
      offlineTemplate = nextTemplate;
      if (offlineLayer) map.removeLayer(offlineLayer);
      offlineLayer = offlineTemplate ? L.tileLayer(offlineTemplate, {
        minZoom: 10, maxNativeZoom: 16, maxZoom: 19,
        updateWhenIdle: true, updateWhenZooming: false, keepBuffer: 1,
        attribution: 'Offline map: <a href="https://www.usgs.gov/programs/national-geospatial-program/national-map">USGS The National Map</a>'
      }) : null;
      if (offlineLayer) offlineLayer.on("tileerror", () => report("Some offline map tiles are missing"));
      offlineActive = false;
      if (mapMode === "offline") applyMapMode();
      else if (mapMode === "auto" && offlineLayer && remoteTileErrors >= 3) applyMapModeFallback();
      remoteTileErrors = 0;
      updateMapModeButton();
    };
    function applyMapModeFallback() {
      if (!offlineLayer || mapMode !== "auto") return;
      if (map.hasLayer(base)) map.removeLayer(base);
      offlineActive = true;
      offlineLayer.addTo(map);
      report("Offline USGS map · automatic fallback");
    }
    window.fitMissionMap = function (data, defaultLat, defaultLon, defaultZoom) {
      const points = [];
      const seen = new Set();
      for (const point of [data.home, data.end, ...(data.boundary || []), ...(data.waypoints || [])]) {
        if (point && Number.isFinite(Number(point.lat)) && Number.isFinite(Number(point.lon))) {
          const lat = Number(point.lat), lon = Number(point.lon), key = lat + "," + lon;
          if (!seen.has(key)) { points.push([lat, lon]); seen.add(key); }
        }
      }
      if (!points.length) {
        map.setView([Number(defaultLat), Number(defaultLon)], Number(defaultZoom));
      } else if (points.length === 1) {
        map.setView(points[0], 19);
      } else {
        map.fitBounds(L.latLngBounds(points), {padding: [28, 28], maxZoom: 19});
      }
    };
    window.centerMissionMap = function (lat, lon, zoom) {
      map.setView([Number(lat), Number(lon)], Number(zoom));
    };
    window.zoomMissionMap = function (change) {
      map.setZoom(map.getZoom() + Number(change));
    };
    map.on("click", event => { if (bridge) bridge.mapClicked(event.latlng.lat, event.latlng.lng); });
    map.on("zoomend", () => { if (bridge) bridge.zoomChanged(map.getZoom()); });
    for (const layer of [terrain, satellite]) {
      layer.on("tileerror", () => {
        if (layer !== base || offlineActive || mapMode === "online") return;
        remoteTileErrors += 1;
        if (mapMode === "auto" && offlineLayer && remoteTileErrors >= 3) {
          applyMapModeFallback();
        } else if (!offlineLayer) {
          report("Map tiles unavailable · save this mission online to prepare its offline map");
        }
      });
      layer.on("tileload", () => {
        if (layer === base && !offlineActive) {
          remoteTileErrors = 0;
          report("");
        }
      });
    }
    if (typeof QWebChannel === "function" && window.qt && qt.webChannelTransport) {
      new QWebChannel(qt.webChannelTransport, channel => {
        bridge = channel.objects.missionBridge;
        if (bridge) {
          bridge.zoomChanged(map.getZoom());
          bridge.mapReady();
        }
      });
    } else {
      report("The map could not connect to the control station.");
    }
  </script>
</body>
</html>
